<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box1 {
      width: 200px;
      height: 200px;
      background-color: pink;
      transition: all .3s;
    }

    .box1:hover {
      /* 缩放，不影响其他元素，一个值是宽高整体扩大，两个值则第一个值为宽（x）第二个值为高（y） */
      transform: scale(1.5);
      /* width: 230px;
      height: 230px; */
    }

    .box2 {
      width: 200px;
      height: 200px;
      background-color: skyblue;
    }
  </style>
</head>

<body>
  <div class="box1"></div>
  <div class="box2"></div>
</body>

</html>
