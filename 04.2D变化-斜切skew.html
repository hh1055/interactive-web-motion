<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 200px;
      height: 55px;
      text-align: center;
      line-height: 55px;
      color: #fff;
      background-color: pink;
      /* 倾斜 skew两个值（x，y）skewX（x）skewY（y） */
      transform: skewX(-16deg);
    }

    .card {
      position: relative;
      width: 240px;
      height: 280px;
      margin: 50px;
    }

    .card div {
      position: absolute;
      top: 0;
      left: 0;
      width: 240px;
      height: 280px;
      border-radius: 0px 30px 40px 40px;
      /* 设置倾斜中心点 */
      transform-origin: top left;
      /* transition: all, .3s; */
      /* transition完整写法：过渡属性 持续时间（这个必写） 速度曲线 延迟时间； */
      transition: 0.8s cubic-bezier(0.075, 0.82, 0.165, 1);
    }

    .card .front {
      z-index: 1;
      /* background-color: rgba(0, 0, 0, 0.4); */
      background-color: rgba(255, 255, 255, 0.4);
      /* 添加滤镜效果 */
      backdrop-filter: blur(30px);
    }

    .card .back {
      background-color: purple;
      transform: skewY(8deg);
    }

    /* 鼠标经过card，里面的back倾斜变大 */
    .card:hover .back {
      transform: skewY(15deg);
      width: 200px;
    }

    .card:hover .front {
      transform: translateY(-3px);
    }
  </style>
</head>

<body>
  <div class="box">英雄联盟</div>

  <!-- 案例效果 -->
  <div class="card">
    <div class="front"></div>
    <div class="back"></div>
  </div>
</body>

</html>
