<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 给父元素添加透视效果 */
    /* 左手定理判断旋转方向：大拇指指向正值方向时，四指指向旋转方向 */
    /* body {
      perspective: 500px;
    } */

    img {
      display: block;
      margin: 0 auto;
      width: 230px;
      transition: all .5s;
    }

    .ldhx {
      transform: rotateX(30deg);
    }

    /* 给子元素添加透视效果 */
    /* 一定要写在前面，作为transform第一个参数 */
    .ldhy:hover {
      transform: perspective(400px) rotateY(360deg);
    }
  </style>
</head>

<body>
  <img src="./img/ldhx.png" alt="" class="ldhx">
  <br>
  <img src="./img/ldhy.jpg" alt="" class="ldhy">
  <br>
  <img src="./img/ldhz.webp" alt="" class="ldhz">
</body>

</html>
