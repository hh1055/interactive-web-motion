<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    img {
      width: 230px;
      transition: all .5s;
    }

    .ldhx:hover {
      /* x轴(指向屏幕为正）旋转 */
      /* 左手定理判断xyz */
      transform: rotateX(180deg);
    }

    .ldhy:hover {
      /* y轴(指向屏幕为正）旋转 */
      /* 左手定理判断xyz */
      transform: rotateY(180deg);
    }

    .ldhz:hover {
      /* z轴(指向屏幕为正）旋转 */
      /* 左手定理判断xyz */
      transform: rotateZ(180deg);
    }
  </style>
</head>

<body>
  <img src="./img(3)/ldhx.png" alt="" class="ldhx">
  <br>
  <img src="./img(3)/ldhy.jpg" alt="" class="ldhy">
  <br>
  <img src="./img(3)/ldhz.webp" alt="" class="ldhz">

</body>

</html>
