<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 1000px;
      height: 100px;
      border: 1px solid red;
    }

    img {
      width: 100px;
      transition: all 2s;
    }

    .box:hover img {
      /* transform: rotate(360deg);
      transform: translate(600px);下边把上边层叠掉了 */
      /* transform: rotate(360deg) translateX(600px);顺序反了 */
      transform: translateX(600px) rotate(360deg);
    }
  </style>
</head>

<body>
  <div class="box">
    <img src="./img(3)/wj.webp" alt="">
  </div>
</body>

</html>
