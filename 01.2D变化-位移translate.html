<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box1 {
      width: 200px;
      height: 200px;
      background-color: pink;
      /* 位移(平移) */
      /* 以自身原来位置移动，不影响其他元素（第一个值x轴往右正值变大，第二个值y轴往下正值变大） */
      /* transform: translate(100px, 100px); */
      /* 只移动x轴 */
      /* transform: translateX(100px); */
      /* 只移动y轴 */
      /* transform: translateY(100px); */
      /* 过渡 */
      transition: all .3s;
    }

    .box1:hover {
      transform: translateY(100px);
    }

    .box2 {
      width: 200px;
      height: 200px;
      background-color: skyblue;
      /* 走自身宽度的50% */
      /* 百分比常用来实现居中 */
      transform: translateX(50%);
    }
  </style>
</head>

<body>
  <div class="box1"></div>
  <div class="box2"></div>
</body>

</html>
